name: RaceDay Part 2 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Raceday.API.sln

      - name: Build solution
        run: dotnet build Raceday.API.sln --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test Raceday.API.sln --configuration Release --no-build --verbosity normal
